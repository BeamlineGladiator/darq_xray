[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "darq_xray"
version = "0.1.0"
description = "DARQ — GUI-driven DFXM (Dark-Field X-ray Microscopy) analysis pipeline for ESRF ID03 data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albert" }]
keywords = ["darq", "dfxm", "esrf", "id03", "x-ray", "microscopy", "strain", "mosaicity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.26.4",
    "h5py>=3.10.0",
    "scipy>=1.11.4",
    "matplotlib>=3.6.3",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "PySide6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "vtk>=9.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-timeout>=2.1"]

# NOTE: install editable (`pip install -e .`). The shipped experiment
# presets live in `experiments/` beside the package, not inside it, so a
# non-editable install leaves this script launching an app with an empty
# preset dropdown (see darq_xray/config/presets.py::experiments_dir).
[project.scripts]
darq_xray = "darq_xray.gui.app:main"

# Named explicitly, because this is a flat layout (darq_xray/, tests/,
# experiments/, tools/, docs/ all sit side by side at the root). Setuptools'
# auto-discovery refuses to guess here — "Multiple top-level packages
# discovered in a flat-layout: ['darq_xray', 'experiments', 'tests']" — and
# without this table `pip install -e .` fails outright on a fresh clone.
# `tests` is a package too but is deliberately not shipped.
[tool.setuptools.packages.find]
include = ["darq_xray*"]

# Ruff conventions inherited from the parent repository: line length 100,
# target py310, lint rules E (pycodestyle) / F (pyflakes) / I (isort).
[tool.ruff]
target-version = "py310"
line-length = 100
# Ruff >= 0.16 formats Python inside Markdown fences. `docs/superpowers/` is an
# archive of plan/spec documents whose code blocks are a historical record of
# what was run at the time — reformatting them rewrites history, and reformats
# 38 files the moment CI picks up a newer ruff. No Python lives under docs/.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort
select = ["E", "F", "I"]
# E501: line too long (handled by the formatter)
ignore = ["E501"]

[tool.ruff.format]
# Double quotes, consistent with the existing scripts.
quote-style = "double"

[tool.pytest.ini_options]
# Run-in-place (no install): make `darq_xray` importable from the project
# root so `python3 -m pytest` works without `pip install -e`.
pythonpath = ["."]
testpaths = ["tests"]
# Silence two third-party deprecation warnings surfaced (not caused) by the
# offscreen GUI tests, so suite output stays pristine:
#  - matplotlib's Qt backend sets the AA_UseHighDpiPixmaps attribute that
#    PySide6 6.x deprecated (fires when a GUI test builds an mpl-Qt canvas);
#  - the GUI tests create a process-global QApplication (Qt threads), so the
#    fork-based StageRunner test (which deliberately exercises start_method
#    "fork") then warns about fork() in a multi-threaded process.
filterwarnings = [
    "ignore:.*AA_UseHighDpiPixmaps.*:DeprecationWarning",
    "ignore:.*multi-threaded, use of fork.*:DeprecationWarning",
]
