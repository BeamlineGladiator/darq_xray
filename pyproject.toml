[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dfxm-pipeline"
version = "0.1.0"
description = "GUI-driven DFXM (Dark-Field X-ray Microscopy) analysis pipeline for ESRF ID03 data"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26.4",
    "h5py>=3.10.0",
    "scipy>=1.11.4",
    "matplotlib>=3.6.3",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "PySide6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "vtk>=9.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

# Named explicitly, because this is a flat layout (dfxm/, gui/, tests/,
# experiments/, tools/, docs/ all sit side by side at the root). Setuptools'
# auto-discovery refuses to guess here — "Multiple top-level packages
# discovered in a flat-layout: ['gui', 'dfxm', 'experiments']" — and without
# this table `pip install -e .` fails outright on a fresh clone. `tests` is a
# package too but is deliberately not shipped.
[tool.setuptools.packages.find]
include = ["dfxm*", "gui*"]

# Ruff conventions inherited from the parent repository: line length 100,
# target py310, lint rules E (pycodestyle) / F (pyflakes) / I (isort).
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort
select = ["E", "F", "I"]
# E501: line too long (handled by the formatter)
ignore = ["E501"]

[tool.ruff.format]
# Double quotes, consistent with the existing scripts.
quote-style = "double"

[tool.pytest.ini_options]
# Run-in-place (no install): make `dfxm` and `gui` importable from the
# project root so `python3 -m pytest` works without `pip install -e`.
pythonpath = ["."]
testpaths = ["tests"]
# Silence two third-party deprecation warnings surfaced (not caused) by the
# offscreen GUI tests, so suite output stays pristine:
#  - matplotlib's Qt backend sets the AA_UseHighDpiPixmaps attribute that
#    PySide6 6.x deprecated (fires when a GUI test builds an mpl-Qt canvas);
#  - the GUI tests create a process-global QApplication (Qt threads), so the
#    fork-based StageRunner test (which deliberately exercises start_method
#    "fork") then warns about fork() in a multi-threaded process.
filterwarnings = [
    "ignore:.*AA_UseHighDpiPixmaps.*:DeprecationWarning",
    "ignore:.*multi-threaded, use of fork.*:DeprecationWarning",
]
