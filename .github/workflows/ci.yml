name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: the action cannot read a ruff version out of pyproject.toml and
      # otherwise installs "latest", so an upstream ruff release turns CI red
      # with no change to this repo (0.16 began formatting Markdown code
      # fences). Bump this deliberately, together with the local ruff.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.14"
          args: check .
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.14"
          args: format --check .

  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The two ENDS of the supported dependency span, so the numpy 1.x / 2.x
        # split is genuinely exercised (see README > Dependencies).
        #
        # `pins` is load-bearing. A bare `python-version: "3.10"` does NOT give
        # the lower bound — pip resolves the newest compatible wheel, which on
        # the first run meant numpy 2.2.6 / scipy 1.15.3: an untested middle
        # set that belongs to neither end. That failed five tests, including
        # `VERIFIED_SCIPY_VERSIONS` doing exactly its job. Pinning the floor is
        # what makes "both ends are exercised" true rather than aspirational.
        include:
          - python-version: "3.10"
            pins: "numpy==1.26.4 scipy==1.11.4 matplotlib==3.6.3"
          - python-version: "3.12"
            pins: ""          # newest compatible: the upper end
    env:
      # The GUI tests each call os.environ.setdefault("QT_QPA_PLATFORM", …);
      # setting it here covers anything that forgets to.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 and VTK are wheels, but they dlopen system GL/X libraries that
      # the bare runner image does not ship. Without these the Qt "offscreen"
      # platform plugin fails to load and every GUI test errors at import.
      - name: Install Qt/VTK runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libopengl0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 \
            libdbus-1-3 libfontconfig1 libxrender1 libxt6 \
            ffmpeg

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # Downgrade to the declared floor on the lower-bound leg. After
      # `pip install -e .`, so it overrides whatever the resolver just chose.
      - name: Pin the lower-bound dependency set
        if: matrix.pins != ''
        run: pip install ${{ matrix.pins }}

      - name: Record the resolved dependency set
        run: pip list | grep -Ei '^(numpy|scipy|matplotlib|pyside6|h5py|vtk|pyvista) '

      # Two checks are deliberately NOT gated here, because both abort the
      # interpreter (not fail a test) without a real GL context, and would make
      # CI red for a reason unrelated to the change under test:
      #   - tests/test_gui_viewer3d.py  (excluded below)
      #   - tests/gui_smoke.py          (segfaults at step [24])
      # Run both locally on a machine with a GPU; see CLAUDE.md.
      #
      # `--timeout` names a hang instead of letting it burn the job's 45 minutes
      # and die as an anonymous "operation was canceled": the first run wedged
      # after 720 tests and the log identified nothing. 1200 s is deliberately
      # far above the longest a test legitimately takes — some allow their own
      # subprocess 900 s — so it fires only on a genuine wedge, never on a slow
      # runner.
      - name: Run tests
        run: >
          python -m pytest -q --ignore=tests/test_gui_viewer3d.py
          --timeout=1200 --timeout-method=signal
